[package]
name = "mcp-host"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.86"
async-trait = "0.1.81"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
uuid = { version = "1.10.0", features = ["v4", "serde"] }
tokio = { version = "1.39.2", features = ["process", "io-util", "time", "macros", "sync", "rt", "rt-multi-thread"] }
tracing = "0.1.40"
thiserror = "1.0.63"
which = "6.0.1"

[features]
default = []
ws = []
http = []

[package]
name = "sprite_assistant"
version = "0.6.0"
description = "Sprite-like AI assistant validation rig"
authors = ["you"]
edition = "2021"

[features]
default = []
vad-debug = []

[lib]
name = "sprite_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
log = "0.4"
tauri-build = { version = "2", features = [] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip", "brotli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
hf-hub = "0.4.3"
tracing = "0.1"
tracing-appender = "0.2"

[dependencies]
log = "0.4"
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
anyhow = "1"
async-channel = "1.9"
cpal = "0.16"
webrtc-vad = "0.4.0"
whisper-rs = { version = "0.15", default-features = false, features = ["openmp", "tracing_backend"] }
# pv_porcupine = "0.0.0"  # TODO: Add when Picovoice crates are published
tokio = { version = "1", features = ["full"] }
notify = "6.1"
hf-hub = "0.4.3"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time"] }
tracing-log = "0.2"
dirs = "5.0"
num_cpus = "1.16"
rodio = { version = "0.17", features = ["wav"] }
machine-uid = "0.5"
urlencoding = "2.1"
mcp-host = { path = "../../../crates/mcp-host" }
uuid = { version = "1", features = ["v4", "serde"] }
keyring = "2.3"
once_cell = "1.19"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "2.3.0"
tauri-plugin-shell = "2.0.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Threading"] }

name: CI

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "apps/tauri/**"
      - "apps/voice-service/**"
      - "packages/shared/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "!**/*.md"
  pull_request:
    paths:
      - "apps/tauri/**"
      - "apps/voice-service/**"
      - "packages/shared/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "!**/*.md"
  workflow_dispatch:
    inputs:
      run_fmt:
        description: "Run cargo fmt"
        type: boolean
        default: false
      run_clippy:
        description: "Run cargo clippy"
        type: boolean
        default: false
      run_test:
        description: "Run cargo test"
        type: boolean
        default: false
      run_build:
        description: "Build Windows installer"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      installer: ${{ steps.filter.outputs.installer }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.before || github.sha }}
          ref: ${{ github.sha }}
          filters: |
            rust:
              - 'apps/tauri/src-tauri/**'
              - 'apps/voice-service/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '!**/*.md'
            installer:
              - 'apps/tauri/**'
              - 'apps/voice-service/**'
              - 'packages/shared/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - '!**/*.md'

  rust-fmt:
    name: Rust Fmt
    runs-on: windows-latest
    needs: changes
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.run_fmt == true) ||
      (github.event_name != 'workflow_dispatch' &&
       !startsWith(github.ref, 'refs/tags/') &&
       needs.changes.outputs.rust == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cargo fmt
        run: cargo fmt -- --check

  rust-clippy:
    name: Rust Clippy
    runs-on: windows-latest
    needs: [rust-fmt, sidecar-build]
    if: |
      always() && !cancelled() &&
      ((github.event_name == 'workflow_dispatch' &&
        inputs.run_clippy == true &&
        (inputs.run_fmt != true || needs.rust-fmt.result == 'success') &&
        (needs.sidecar-build.result == 'success' || needs.sidecar-build.result == 'skipped')) ||
       (github.event_name != 'workflow_dispatch' &&
        !startsWith(github.ref, 'refs/tags/') &&
        needs.rust-fmt.result == 'success' &&
        (needs.sidecar-build.result == 'success' || needs.sidecar-build.result == 'skipped')))
    env:
      PYTHON_VERSION: "3.11"
      GGML_NATIVE: "OFF"
      GGML_AVX2: "ON"
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install sccache
        uses: taiki-e/install-action@v2
        with:
          tool: sccache
      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-clippy-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            sccache-clippy-${{ runner.os }}-
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cargo fetch
        run: cargo fetch
      - name: Cache Whisper model
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: apps/tauri/src-tauri/resources/whisper
          key: whisper-${{ runner.os }}-${{ hashFiles('apps/tauri/src-tauri/stt.config.json') }}
      - name: Cache voice sidecar
        id: sidecar-cache
        uses: actions/cache@v4
        with:
          path: apps/tauri/src-tauri/resources/sprite_voice_sidecar.exe
          key: sidecar-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('apps/voice-service/requirements.txt', 'apps/voice-service/build.py', 'apps/voice-service/setup.py', 'apps/voice-service/**/*.py') }}
      - name: Verify voice sidecar cache
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        run: |
          Write-Error "Voice sidecar cache missing. Ensure sidecar-build runs first."
      - name: Cargo clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Sccache stats
        if: always()
        run: sccache --show-stats

  rust-test:
    name: Rust Test
    runs-on: windows-latest
    needs: [rust-fmt, sidecar-build]
    if: |
      always() && !cancelled() &&
      ((github.event_name == 'workflow_dispatch' &&
        inputs.run_test == true &&
        (inputs.run_fmt != true || needs.rust-fmt.result == 'success') &&
        (needs.sidecar-build.result == 'success' || needs.sidecar-build.result == 'skipped')) ||
       (github.event_name != 'workflow_dispatch' &&
        !startsWith(github.ref, 'refs/tags/') &&
        needs.rust-fmt.result == 'success' &&
        (needs.sidecar-build.result == 'success' || needs.sidecar-build.result == 'skipped')))
    env:
      PYTHON_VERSION: "3.11"
      GGML_NATIVE: "OFF"
      GGML_AVX2: "ON"
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install sccache
        uses: taiki-e/install-action@v2
        with:
          tool: sccache
      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            sccache-test-${{ runner.os }}-
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - name: Cache voice sidecar
        id: sidecar-cache
        uses: actions/cache@v4
        with:
          path: apps/tauri/src-tauri/resources/sprite_voice_sidecar.exe
          key: sidecar-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('apps/voice-service/requirements.txt', 'apps/voice-service/build.py', 'apps/voice-service/setup.py', 'apps/voice-service/**/*.py') }}
      - name: Verify voice sidecar cache
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        run: |
          Write-Error "Voice sidecar cache missing. Ensure sidecar-build runs first."
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo fetch
        run: cargo fetch
      - name: Cargo test
        run: cargo test --workspace
      - name: Sccache stats
        if: always()
        run: sccache --show-stats

  sidecar-build:
    name: Build Voice Sidecar
    runs-on: windows-latest
    needs: changes
    if: |
      always() && !cancelled() &&
      (startsWith(github.ref, 'refs/tags/') ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.run_clippy == true || inputs.run_test == true || inputs.run_build == true)) ||
       (github.event_name != 'workflow_dispatch' &&
        (needs.changes.outputs.installer == 'true' || needs.changes.outputs.rust == 'true')))
    env:
      PYTHON_VERSION: "3.11"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache voice sidecar
        id: sidecar-cache
        uses: actions/cache@v4
        with:
          path: apps/tauri/src-tauri/resources/sprite_voice_sidecar.exe
          key: sidecar-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('apps/voice-service/requirements.txt', 'apps/voice-service/build.py', 'apps/voice-service/setup.py', 'apps/voice-service/**/*.py') }}
      - name: Install voice dependencies
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        run: python apps/voice-service/setup.py
      - name: Build voice sidecar
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        run: python apps/voice-service/build.py

  build-tauri:
    name: Build Windows Installer
    runs-on: windows-latest
    permissions:
      contents: write
    needs: [changes, rust-clippy, rust-test, sidecar-build]
    if: |
      always() && !cancelled() &&
      (startsWith(github.ref, 'refs/tags/') ||
       (github.event_name == 'workflow_dispatch' && inputs.run_build == true)) &&
      (needs.sidecar-build.result == 'success' || needs.sidecar-build.result == 'skipped') &&
      (startsWith(github.ref, 'refs/tags/') ||
       github.event_name == 'workflow_dispatch' ||
       (needs.rust-clippy.result == 'success' || needs.rust-clippy.result == 'skipped')) &&
      (startsWith(github.ref, 'refs/tags/') ||
       github.event_name == 'workflow_dispatch' ||
       (needs.rust-test.result == 'success' || needs.rust-test.result == 'skipped')) &&
      (github.event_name != 'workflow_dispatch' || inputs.run_clippy != true || needs.rust-clippy.result == 'success') &&
      (github.event_name != 'workflow_dispatch' || inputs.run_test != true || needs.rust-test.result == 'success')
    env:
      PYTHON_VERSION: "3.11"
      GGML_NATIVE: "OFF"
      GGML_AVX2: "ON"
      RUSTFLAGS: "-C target-cpu=haswell -C target-feature=-avx512f,-avx512vl"
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Set artifact name
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $artifact = "desktop-installer-release-$($env:GITHUB_REF_NAME)"
          } else {
            git fetch --tags --force
            $latestTag = git tag --list "v*" --sort=-v:refname | Select-Object -First 1
            if (-not $latestTag) { $latestTag = "v0.0.0" }
            $artifact = "desktop-installer-beta-$latestTag.$($env:GITHUB_RUN_NUMBER)"
          }
          "ARTIFACT_NAME=$artifact" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Resolve pnpm store path
        id: pnpm-store
        shell: pwsh
        run: |
          "store-path=$(pnpm store path --silent)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.store-path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install sccache
        uses: taiki-e/install-action@v2
        with:
          tool: sccache
      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-build-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            sccache-build-${{ runner.os }}-
            sccache-${{ runner.os }}-
        # TODO: Remove the legacy sccache restore key once the build cache is warm.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - name: Cache Whisper model
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: apps/tauri/src-tauri/resources/whisper
          key: whisper-${{ runner.os }}-${{ hashFiles('apps/tauri/src-tauri/stt.config.json') }}
      - name: Cache voice sidecar
        id: sidecar-cache
        uses: actions/cache@v4
        with:
          path: apps/tauri/src-tauri/resources/sprite_voice_sidecar.exe
          key: sidecar-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('apps/voice-service/requirements.txt', 'apps/voice-service/build.py', 'apps/voice-service/setup.py', 'apps/voice-service/**/*.py') }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install voice dependencies
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        run: pnpm install:voice
      - name: Build voice sidecar
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        run: pnpm build:voice
      - name: Build shared packages
        run: pnpm build:shared
      - name: Build desktop installer
        run: pnpm build:tauri
      - name: Sccache stats
        if: always()
        run: sccache --show-stats
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/tauri/src-tauri/target/release/bundle/nsis/**/*.exe
          body: |
            Recommended download: NSIS installer (x64).
          append_body: true
          generate_release_notes: true
